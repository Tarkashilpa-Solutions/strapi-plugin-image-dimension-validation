name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 18
          - 20
          - 22
          - 24

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

  compatibility:
    name: ${{ matrix.type }} — Strapi ${{ matrix.strapi-version }} / Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Strapi 5.0.0 ──
          - strapi-version: '5.0.0'
            node-version: 18
            type: 'Supported'
          - strapi-version: '5.0.0'
            node-version: 20
            type: 'Supported'

          # ── Strapi 5.31.0 ──
          - strapi-version: '5.31.0'
            node-version: 20
            type: 'Supported'
          - strapi-version: '5.31.0'
            node-version: 22
            type: 'Supported'
          - strapi-version: '5.31.0'
            node-version: 24
            type: 'Supported'

          # ── Strapi 5.48.1 ──
          - strapi-version: '5.48.1'
            node-version: 22
            type: 'Supported'
          - strapi-version: '5.48.1'
            node-version: 24
            type: 'Supported'

          # ── Current: latest Strapi ──
          - strapi-version: 'latest'
            node-version: 24
            type: 'Current'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # Build the plugin first
      - name: Install plugin dependencies
        run: npm ci

      - name: Build plugin
        run: npm run build

      - name: Pack plugin
        shell: bash
        run: |
          npm pack
          echo "PLUGIN_TGZ=$(ls *.tgz | head -n 1)" >> "$GITHUB_ENV"

      # Create a real Strapi application
      - name: Create Strapi test application
        shell: bash
        run: |
          npx create-strapi-app@${{ matrix.strapi-version }} \
            /tmp/strapi-test \
            --no-run \
            --no-example

      # Configure SQLite
      - name: Configure SQLite
        working-directory: /tmp/strapi-test
        shell: bash
        run: |
          mkdir -p .tmp

          cat > config/database.ts <<'EOF'
          export default ({ env }) => ({
            connection: {
              client: 'sqlite',
              connection: {
                filename: env('DATABASE_FILENAME', '.tmp/data.db'),
              },
              useNullAsDefault: true,
            },
          });
          EOF

      # Install the locally built plugin
      - name: Install plugin
        working-directory: /tmp/strapi-test
        shell: bash
        run: |
          npm install "${GITHUB_WORKSPACE}/${PLUGIN_TGZ}"

      - name: Verify Strapi installation
        working-directory: /tmp/strapi-test
        run: |
          npx strapi version

      # Build the actual Strapi application with the plugin installed
      - name: Build Strapi application
        working-directory: /tmp/strapi-test
        run: |
          npm run build

      # Start Strapi and verify that it can boot
      - name: Start Strapi application
        working-directory: /tmp/strapi-test
        shell: bash
        run: |
          npx strapi start > /tmp/strapi.log 2>&1 &
          STRAPI_PID=$!

          echo "Waiting for Strapi to start..."

          for i in {1..60}; do
            if curl -sf http://localhost:1337/admin > /dev/null; then
              echo "Strapi started successfully"
              kill $STRAPI_PID
              exit 0
            fi

            if ! kill -0 $STRAPI_PID 2>/dev/null; then
              echo "Strapi process exited unexpectedly"
              cat /tmp/strapi.log
              exit 1
            fi

            sleep 2
          done

          echo "Strapi failed to start"
          cat /tmp/strapi.log

          kill $STRAPI_PID || true
          exit 1

  unit-tests:
    name: Unit Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build

    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 18
          - 20
          - 22
          - 24

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit

  # integration-tests:
  #   name: Integration Tests
  #   runs-on: ubuntu-latest
  #   timeout-minutes: 20
  #   needs: build

  #   steps:
  #     - name: Checkout
  #       uses: actions/checkout@v4

  #     - name: Setup Node.js
  #       uses: actions/setup-node@v4
  #       with:
  #         node-version: 24
  #         cache: npm

  #     - name: Install dependencies
  #       run: npm ci

  #     - name: Build package
  #       run: npm run build

  #     - name: Run integration tests
  #       run: npm run test:integration

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage
