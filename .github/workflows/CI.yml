name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 18
          - 20
          - 22
          - 24

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

  compatibility:
    name: ${{ matrix.type }} — Strapi ${{ matrix.strapi-version }} / Node ${{ matrix.node-version }}

    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false

      matrix:
        include:
          - strapi-version: '5.0.0'
            node-version: 18
            type: 'Supported'

          - strapi-version: '5.0.0'
            node-version: 20
            type: 'Supported'

          - strapi-version: '5.31.0'
            node-version: 20
            type: 'Supported'

          - strapi-version: '5.31.0'
            node-version: 22
            type: 'Supported'

          - strapi-version: '5.31.0'
            node-version: 24
            type: 'Supported'

          - strapi-version: '5.48.1'
            node-version: 22
            type: 'Supported'

          - strapi-version: '5.48.1'
            node-version: 24
            type: 'Supported'

          - strapi-version: 'latest'
            node-version: 24
            type: 'Current'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install package dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Verify Strapi compatibility
        run: |
          mkdir -p /tmp/strapi-test
          cd /tmp/strapi-test
          npm init -y

          npm install \
            "@strapi/strapi@${{ matrix.strapi-version }}" \
            "@strapi/admin@${{ matrix.strapi-version }}" \
            "@strapi/plugin-users-permissions@${{ matrix.strapi-version }}"

          npm install "${GITHUB_WORKSPACE}"

          npx strapi version

  unit-tests:
    name: Unit Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build

    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 18
          - 20
          - 22
          - 24

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit

  # integration-tests:
  #   name: Integration Tests
  #   runs-on: ubuntu-latest
  #   timeout-minutes: 20
  #   needs: build

  #   steps:
  #     - name: Checkout
  #       uses: actions/checkout@v4

  #     - name: Setup Node.js
  #       uses: actions/setup-node@v4
  #       with:
  #         node-version: 24
  #         cache: npm

  #     - name: Install dependencies
  #       run: npm ci

  #     - name: Build package
  #       run: npm run build

  #     - name: Run integration tests
  #       run: npm run test:integration

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage
